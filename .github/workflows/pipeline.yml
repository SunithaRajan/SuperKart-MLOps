
name: SuperKart ML Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Download dataset from Hugging Face
        run: |
          mkdir -p data
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='Sunitha-AIML2026/superkart-sales', filename='SuperKart.csv', repo_type='dataset', local_dir='data')"
          find data -maxdepth 2 -type f -print

      - name: Run ML pipeline
        run: python train.py

      - name: Upload model and metrics as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superkart-model-and-metrics
          path: |
            artifacts/superkart_random_forest_pipeline.joblib
            artifacts/metrics.json
